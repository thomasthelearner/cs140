<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Processing Project</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Registration</h1>
    </header>
    <main>
        <form action='.html' method='post' id="myForm">
            <fieldset>
                <legend>Sign Up Form</legend>
                <div id="notification">
                    <div class="form-row">
                        <label for="firstname">First Name</label>
                        <input type="text" id="firstname" name="firstname" placeholder="First Name">
                    </div>
                    <div class="form-row">
                        <label for="lastname">Last Name</label>
                        <input type="text" id="lastname" name="lastname" placeholder="Last Name" required>
                    </div>
                    <div class="form-row">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Username" required>
                    </div>
                    <div class="form-row">
                        <label for="email">Email</label>
                        <input type="text" id="email" name="email" placeholder="Email" required>
                    </div>
                    <div class="form-row">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Password" required>
                    </div>
                    <div class="form-row">
                        <label for="state">State</label>
                        <select id="state" name="state">
                            <option value="">-- Select a state --</option>
                            <option value="HI">Hawaii</option>
                            <option value="CA">California</option>
                            <option value="NY">New York</option>
                            <option value="TX">Texas</option>
                            <option value="FL">Florida</option>
                        </select>
                    </div>
                    <div class="check-row">
                        <div class="spacer">Gender</div>
                        <label><input type='radio' name='gender' value='male'> Male</label>
                        <label><input type='radio' name='gender' value='female'> Female</label>
                    </div>
                    <div class="form-row">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob" name="dob">
                    </div>
                    <div class="term-group">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">I agree to <a href="#" target="_blank">the terms</a> and <a href="#" target="_blank">conditions</a></label>
                    </div>
                    <div class="form-row submit-row">
                        <button type="submit">Submit</button>
                    </div>
                </div>
            </fieldset>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Tom's Form Processing Project. All rights reserved.</p>
    </footer>
</body>
</html>
