<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Family - Responsive Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Doraemon's Family</h1>
    </header>
    <nav>
        <a href="#">Link</a>
        <a href="#">Link</a>
        <a href="#">Link</a>
        <a href="#">Link</a>
        <a href="#">Link</a>
    </nav>
    <div class="mainrow">
        <div class='sidebar'>
            <h2>Summary about the family</h2>
            <figure class="family_photo">
                <img src="family.jpeg" alt="Doraemon and his family">
                <figcaption><i>Photo: Doraemon and his family</i></figcaption>
                <ul>
                    <li>Doraemon lives with Nobita and his parents, Nobisuke and Tamako.</li>
                    <li>Their daily lives combine family moments with adventures using futuristic gadgets.</li>
                    <li>Together, they learn about friendship, kindness, and responsibility.</li>
                </ul>
            </figure>
        </div>
        <main>
            <h2>Doraemon's Family Members</h2>
            <div class="card-container">
                <article>
                    <figure class="card">
                        <img src="doraemon.jpeg" alt="Doraemon">
                        <figcaption>
                            <h3>Doraemon — A Friend from the Future</h3>
                        </figcaption>
                        <p>Doraemon is a blue robotic cat from the future who lives with the Nobi family. He uses gadgets from his four-dimensional pocket to help Nobita solve everyday problems. Although his gadgets sometimes lead to unexpected trouble, he always cares deeply about Nobita. He also loves dorayaki, a Japanese treat filled with sweet red bean paste.</p>
                    </figure>
                </article>
                <article>
                    <figure class="card">
                        <img src="nobita.jpeg" alt="Nobita">
                        <figcaption>
                            <h3>Nobita Nobi — A Kind Heart Behind the Trouble</h3>
                        </figcaption>
                        <p>Nobita is a kindhearted boy who often struggles with schoolwork and sports. He frequently asks Doraemon for gadgets to make his life easier, but his shortcuts sometimes create bigger problems. Despite his weaknesses, he cares about his friends and stands up for others when it matters. His adventures teach him lessons about courage and responsibility.</p>
                    </figure>
                </article>
                <article>
                    <figure class="card">
                        <img src="nobita_dad.jpeg" alt="Nobisuke">
                        <figcaption>
                            <h3>Nobisuke Nobi — A Loving Father</h3>
                        </figcaption>
                        <p>Nobisuke is Nobita’s father and works to support his family. He has an easygoing personality and enjoys relaxing at home after work. He sometimes shares memories of his childhood to help Nobita understand life’s challenges. His gentle and supportive nature makes him a comforting presence in the household.</p>
                    </figure>
                </article>
                <article>
                    <figure class="card">
                        <img src="nobita_mom.jpg" alt="Tamako">
                        <figcaption>
                            <h3>Tamako Nobi — A Caring Mother</h3>
                        </figcaption>
                        <p>Tamako is Nobita’s mother and manages the household’s daily routines. She often reminds Nobita to complete his homework, clean his room, and improve his grades. Although she can be strict, she cares deeply about her family. She wants Nobita to become more responsible and learn to handle challenges on his own.</p>
                    </figure>
                </article>
            </div>
        </main>
    </div>

</body>
</html>
